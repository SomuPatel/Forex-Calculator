<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Calculator</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b0f17">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0f17;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
    background:#141b26;
    border-radius:24px;
    padding:22px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:30px;
}

.tv-widget{
    margin-bottom:20px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #253046;
}

.row{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#a8b6cf;
    font-size:14px;
}

input,select{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#0d131d;
    color:white;
    border:1px solid #253046;
    font-size:15px;
}

.toggle{
    display:flex;
    gap:10px;
}

.toggle button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    background:#1c2433;
    color:white;
}

.buy.active{
    background:#00c853;
    box-shadow:0 0 15px rgba(0,255,136,0.5);
}

.sell.active{
    background:#ff3b3b;
    box-shadow:0 0 15px rgba(255,59,59,0.5);
}

.result{
    margin-top:22px;
    background:#0d131d;
    border:1px solid #253046;
    border-radius:18px;
    padding:18px;
}

.result h2{
    margin-bottom:16px;
}

.result-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:15px;
}

.green{
    color:#00ff99;
}

.red{
    color:#ff5c5c;
}

.yellow{
    color:#ffcc00;
}

.install-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#00c853;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:18px;
    cursor:pointer;
    display:none;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        <h1>Forex Calculator</h1>
    </div>

    <!-- TRADINGVIEW -->

    <div class="tv-widget">

        <iframe
        id="tvFrame"
        src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=BINANCE:BTCUSDT&interval=1&hidesidetoolbar=1&symboledit=1&saveimage=0&toolbarbg=0b0f17&theme=dark"
        width="100%"
        height="300"
        frameborder="0">
        </iframe>

    </div>

    <!-- ASSET -->

    <div class="row">

        <label>Select Asset</label>

        <select id="asset">

            <option value="BTCUSDT">
                BTCUSDT
            </option>

            <option value="XAUUSD">
                XAUUSD
            </option>

            <option value="XAGUSD">
                XAGUSD
            </option>

        </select>

    </div>

    <!-- POSITION -->

    <div class="row">

        <label>Position</label>

        <div class="toggle">

            <button
            type="button"
            class="buy active"
            id="buyBtn">

                BUY

            </button>

            <button
            type="button"
            class="sell"
            id="sellBtn">

                SELL

            </button>

        </div>

    </div>

    <!-- ENTRY -->

    <div class="row">

        <label>Entry Price</label>

        <input
        type="number"
        id="entry"
        placeholder="Enter Entry Price">

    </div>

    <!-- LOT -->

    <div class="row">

        <label>Quantity / Lot Size</label>

        <input
        type="number"
        id="qty"
        placeholder="0.01">

    </div>

    <!-- LEVERAGE -->

    <div class="row">

        <label>Leverage</label>

        <select id="leverage">

            <option value="10">10x</option>
            <option value="20">20x</option>
            <option value="50">50x</option>
            <option value="100">100x</option>
            <option value="200">200x</option>

        </select>

    </div>

    <!-- TP -->

    <div class="row">

        <label>TP Type</label>

        <select id="tpType">

            <option value="price">
                By Market Price
            </option>

            <option value="amount">
                By Amount
            </option>

        </select>

    </div>

    <div class="row">

        <label>TP Value</label>

        <input
        type="number"
        id="tpValue"
        placeholder="Enter TP">

    </div>

    <!-- SL -->

    <div class="row">

        <label>SL Type</label>

        <select id="slType">

            <option value="price">
                By Market Price
            </option>

            <option value="amount">
                By Amount
            </option>

        </select>

    </div>

    <div class="row">

        <label>SL Value</label>

        <input
        type="number"
        id="slValue"
        placeholder="Enter SL">

    </div>

    <!-- RESULT -->

    <div class="result">

        <h2>Trade Summary</h2>

        <div class="result-item">
            <span>TP Price</span>
            <span id="tpPrice">-</span>
        </div>

        <div class="result-item">
            <span>SL Price</span>
            <span id="slPrice">-</span>
        </div>

        <div class="result-item">
            <span>Estimated Profit</span>
            <span class="green" id="profit">-</span>
        </div>

        <div class="result-item">
            <span>Estimated Loss</span>
            <span class="red" id="loss">-</span>
        </div>

        <div class="result-item">
            <span>Risk Reward</span>
            <span id="rr">-</span>
        </div>

        <div class="result-item">
            <span>Required Margin</span>
            <span id="margin">-</span>
        </div>

        <div class="result-item">
            <span>Liquidation</span>
            <span class="yellow" id="liq">-</span>
        </div>

    </div>

    <!-- INSTALL BUTTON -->

    <button id="installBtn" class="install-btn">
        Install App
    </button>

</div>

<script>

let position = "BUY";

const buyBtn =
document.getElementById("buyBtn");

const sellBtn =
document.getElementById("sellBtn");


// BUY

buyBtn.onclick = () => {

    position = "BUY";

    buyBtn.classList.add("active");

    sellBtn.classList.remove("active");

};


// SELL

sellBtn.onclick = () => {

    position = "SELL";

    sellBtn.classList.add("active");

    buyBtn.classList.remove("active");

};


// TRADINGVIEW CHANGE

document.getElementById("asset")
.addEventListener("change", () => {

    const asset =
    document.getElementById("asset").value;

    let symbol = "";

    if(asset === "BTCUSDT"){

        symbol =
        "BINANCE:BTCUSDT";

    }

    else if(asset === "XAUUSD"){

        symbol =
        "OANDA:XAUUSD";

    }

    else if(asset === "XAGUSD"){

        symbol =
        "OANDA:XAGUSD";

    }

    document.getElementById("tvFrame")
    .src =
    `https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=${symbol}&interval=1&hidesidetoolbar=1&symboledit=1&saveimage=0&toolbarbg=0b0f17&theme=dark`;

});


// CALCULATION

function calculateTrade(){

    const entry =
    parseFloat(
    document.getElementById("entry").value
    );

    const qty =
    parseFloat(
    document.getElementById("qty").value
    );

    const leverage =
    parseFloat(
    document.getElementById("leverage").value
    );

    const tpType =
    document.getElementById("tpType").value;

    const slType =
    document.getElementById("slType").value;

    const tpValue =
    parseFloat(
    document.getElementById("tpValue").value
    );

    const slValue =
    parseFloat(
    document.getElementById("slValue").value
    );

    if(
    !entry ||
    !qty ||
    !tpValue ||
    !slValue
    ){
        return;
    }

    let tpPrice;
    let slPrice;

    let profit;
    let loss;


    // TP

    if(tpType === "price"){

        tpPrice = tpValue;

        if(position === "BUY"){

            profit =
            ((tpPrice - entry)
            * qty)
            * leverage;

        }else{

            profit =
            ((entry - tpPrice)
            * qty)
            * leverage;

        }

    }else{

        profit = tpValue;

        if(position === "BUY"){

            tpPrice =
            entry +
            (
            profit /
            (qty * leverage)
            );

        }else{

            tpPrice =
            entry -
            (
            profit /
            (qty * leverage)
            );

        }

    }


    // SL

    if(slType === "price"){

        slPrice = slValue;

        if(position === "BUY"){

            loss =
            ((entry - slPrice)
            * qty)
            * leverage;

        }else{

            loss =
            ((slPrice - entry)
            * qty)
            * leverage;

        }

    }else{

        loss = slValue;

        if(position === "BUY"){

            slPrice =
            entry -
            (
            loss /
            (qty * leverage)
            );

        }else{

            slPrice =
            entry +
            (
            loss /
            (qty * leverage)
            );

        }

    }


    const rr =
    (profit / loss)
    .toFixed(2);

    const margin =
    (
    (entry * qty)
    / leverage
    ).toFixed(2);

    const liquidation =
    position === "BUY"

    ?

    (
    entry -
    (entry / leverage)
    ).toFixed(2)

    :

    (
    entry +
    (entry / leverage)
    ).toFixed(2);


    document.getElementById("tpPrice")
    .innerText =
    "$" +
    tpPrice.toFixed(2);

    document.getElementById("slPrice")
    .innerText =
    "$" +
    slPrice.toFixed(2);

    document.getElementById("profit")
    .innerText =
    "$" +
    profit.toFixed(2);

    document.getElementById("loss")
    .innerText =
    "$" +
    loss.toFixed(2);

    document.getElementById("rr")
    .innerText =
    "1 : " + rr;

    document.getElementById("margin")
    .innerText =
    "$" + margin;

    document.getElementById("liq")
    .innerText =
    "$" + liquidation;

}

document
.querySelectorAll("input, select")
.forEach(el => {

    el.addEventListener(
    "input",
    calculateTrade
    );

});


// PWA INSTALL

let deferredPrompt;

const installBtn =
document.getElementById("installBtn");

window.addEventListener(
"beforeinstallprompt",
(e) => {

    e.preventDefault();

    deferredPrompt = e;

    installBtn.style.display =
    "block";

});

installBtn.addEventListener(
"click",
async () => {

    if(deferredPrompt){

        deferredPrompt.prompt();

    }

});


// SERVICE WORKER

if("serviceWorker" in navigator){

    navigator.serviceWorker.register(
    "service-worker.js"
    );

}

</script>

</body>

</html>
